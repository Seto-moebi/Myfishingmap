<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>俺たちの釣りマップ（この端末だけ）</title>

<!-- Leaflet (地図表示) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- exifr (写真のEXIF/GPS情報を読み取るライブラリ) -->
<script src="https://unpkg.com/exifr/dist/full.umd.js"></script>

<!-- 目的別マップの一覧定義（index.htmlと共通） -->
<script src="config.js"></script>

<style>
  :root {
    --accent: #2563eb;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  #drop-zone {
    flex: 1;
    min-width: 240px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop-zone.dragover {
    border-color: var(--accent);
    background: #eef3ff;
    color: var(--accent);
  }
  #file-input { display: none; }
  #status {
    font-size: 12px;
    color: var(--muted);
    min-width: 160px;
    text-align: right;
  }
  #local-note {
    width: 100%;
    font-size: 11.5px;
    color: var(--muted);
    background: #fffbea;
    border: 1px solid #f0e2a3;
    border-radius: 6px;
    padding: 6px 10px;
  }
  #back-link {
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  #back-link:hover { text-decoration: underline; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #map { flex: 1; }
  #sidebar {
    width: 280px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  #sidebar .empty {
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .photo-item {
    display: flex;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    align-items: center;
  }
  .photo-item:hover { background: #f8f9fb; }
  .photo-item img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    background: #ddd;
    flex-shrink: 0;
  }
  .photo-item .meta {
    min-width: 0;
  }
  .photo-item .name {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .photo-item .coords {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .photo-item.no-gps .coords { color: #d97706; }
  .popup-thumb {
    width: 180px;
    max-width: 100%;
    border-radius: 6px;
    display: block;
    margin-bottom: 6px;
  }
  .popup-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .popup-coords { font-size: 12px; color: var(--muted); }
  .popup-title-input {
    display: block;
    width: 100%;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 6px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    border-radius: 4px;
    box-sizing: border-box;
  }
  .popup-title-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .popup-delete-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 8px;
    border: 1px solid #dc2626;
    color: #dc2626;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
  }
  .popup-delete-btn:hover { background: #dc2626; color: #fff; }

  /* 削除確認のポップアップ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    width: calc(100% - 40px);
    max-width: 320px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
  }
  .modal img {
    display: block;
    width: 100%;
    max-height: 200px;
    object-fit: contain;
    background: #f0f0f0;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .modal p {
    margin: 0 0 14px;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-line;
  }
  .modal .actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .modal button {
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  .modal button.danger {
    background: #dc2626;
    border-color: #dc2626;
    color: #fff;
    font-weight: 600;
  }

  /* スマホ表示: 地図を大きく、一覧を下に小さく配置 */
  @media (max-width: 768px) {
    main {
      flex-direction: column;
    }
    #map {
      flex: 1 1 auto;
      min-height: 0;
    }
    #sidebar {
      width: 100%;
      flex: 0 0 auto;
      max-height: 22vh;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    .photo-item {
      padding: 8px 14px;
    }
  }
</style>
</head>
<body>

<header>
  <a id="back-link" href="index.html">← マップ一覧</a>
  <h1 id="page-title">📍 俺たちの釣りマップ</h1>
  <div id="drop-zone">
    ここに写真をドラッグ&ドロップ、またはクリックして選択（複数選択可 / iPhoneのHEIC・JPEG対応）
    <input type="file" id="file-input" accept="image/*" multiple />
  </div>
  <div id="status">写真: 0件 / GPSあり: 0件</div>
  <div id="local-note">※ このページはこの端末・このブラウザの中だけに写真とピンを保存します（他の端末とは共有されません）。ブラウザのデータを消すと写真も消えるのでご注意ください。</div>
</header>

<main>
  <div id="map"></div>
  <div id="sidebar">
    <div class="empty">写真を読み込み中…</div>
  </div>
</main>

<div class="modal-overlay" id="delete-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-text">
    <img id="delete-modal-img" alt="" />
    <p id="delete-modal-text"></p>
    <div class="actions">
      <button type="button" id="delete-modal-cancel">キャンセル</button>
      <button type="button" class="danger" id="delete-modal-confirm">削除する</button>
    </div>
  </div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const statusEl = document.getElementById('status');
const sidebar = document.getElementById('sidebar');

// --- URLの ?map=xxx から、どの場所のマップかを決める ---
const mapId = new URLSearchParams(location.search).get('map');
const mapInfo = FISHING_MAPS.find(m => m.id === mapId);
if (!mapInfo) {
  // 場所が指定されていない/不正な場合はマップ一覧に戻す
  location.replace('index.html');
  throw new Error('map not specified, redirecting to index.html');
}
document.getElementById('page-title').textContent = `📍 ${mapInfo.label}`;
document.title = mapInfo.label;

// --- この端末内だけの保存先（IndexedDB。場所ごとに別々に保存） ---
const DB_NAME = `photo-gps-map-local-${mapInfo.id}`;
const STORE_NAME = 'photos';

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE_NAME, { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(record) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGetAll() {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(key) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 地図の初期化（日本付近を初期表示。写真が追加されたら自動でフィットする）
const map = L.map('map').setView([35.681236, 139.767125], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

const markerGroup = L.layerGroup().addTo(map);
let totalCount = 0;
let gpsCount = 0;
const loadedKeys = new Set(); // 読み込み済み写真のname_size（重複追加防止）
const recordsByKey = new Map(); // key -> record（題名編集などで参照）
const elementsByKey = new Map(); // key -> { record, item, marker, imgSrc }（削除時に参照）

// レイアウト確定後にタイルが正しく表示されるようサイズを再計算
window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 200));
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 200));

function updateStatus() {
  statusEl.textContent = `写真: ${totalCount}件 / GPSあり: ${gpsCount}件`;
}

function clearEmptyMessage() {
  const empty = sidebar.querySelector('.empty');
  if (empty) empty.remove();
}

function showEmptyMessage(text) {
  if (totalCount > 0) return;
  clearEmptyMessage();
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.textContent = text;
  sidebar.appendChild(empty);
}

function makeKey() {
  return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(16).slice(2)}`);
}

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpg|jpeg|png|tiff?)$/i.test(f.name));
  if (files.length === 0) return;

  for (const file of files) {
    const dedupeKey = `${file.name}_${file.size}`;
    if (loadedKeys.has(dedupeKey)) continue; // 既に追加済みの写真はスキップ
    loadedKeys.add(dedupeKey);

    let lat = null, lon = null, takenAt = null;

    try {
      // exifr.gps() は {latitude, longitude} を10進度で返してくれる（HEIC/JPEG両対応）
      const gps = await exifr.gps(file);
      if (gps && typeof gps.latitude === 'number' && typeof gps.longitude === 'number') {
        lat = gps.latitude;
        lon = gps.longitude;
      }
      try {
        const exif = await exifr.parse(file, { pick: ['DateTimeOriginal'] });
        if (exif && exif.DateTimeOriginal) takenAt = exif.DateTimeOriginal;
      } catch (e) { /* 撮影日時が取れなくても無視 */ }
    } catch (err) {
      console.warn('EXIF読み取りに失敗:', file.name, err);
    }

    const record = {
      key: makeKey(),
      name: file.name,
      size: file.size,
      blob: file,
      lat, lon,
      takenAt: takenAt ? new Date(takenAt).toISOString() : null,
      title: ''
    };

    try {
      await dbPut(record);
    } catch (err) {
      console.warn('この端末への保存に失敗しました:', file.name, err);
      alert(`「${file.name}」の保存に失敗しました。`);
      loadedKeys.delete(dedupeKey);
      continue;
    }

    recordsByKey.set(record.key, record);
    renderPhoto(record, URL.createObjectURL(file));
    if (lat !== null && lon !== null) fitToMarkers();
  }
}

function renderPhoto(record, imgSrc) {
  clearEmptyMessage();
  totalCount++;

  const { lat, lon, takenAt, name } = record;

  const item = document.createElement('div');
  item.className = 'photo-item' + (lat === null ? ' no-gps' : '');

  const img = document.createElement('img');
  img.src = imgSrc;
  item.appendChild(img);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = name;
  meta.appendChild(nameEl);

  const coordsEl = document.createElement('div');
  coordsEl.className = 'coords';
  if (lat !== null && lon !== null) {
    coordsEl.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    gpsCount++;
  } else {
    coordsEl.textContent = '位置情報なし';
  }
  meta.appendChild(coordsEl);
  item.appendChild(meta);
  sidebar.appendChild(item);

  let marker = null;

  if (lat !== null && lon !== null) {
    marker = L.marker([lat, lon]);

    const popupNode = document.createElement('div');

    const popupImg = document.createElement('img');
    popupImg.className = 'popup-thumb';
    popupImg.src = imgSrc;
    popupNode.appendChild(popupImg);

    // いつでも編集できる題名入力欄（変更するとこの端末に保存される）
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.className = 'popup-title-input';
    titleInput.placeholder = '題名を入力';
    titleInput.value = record.title || '';
    titleInput.addEventListener('change', () => {
      record.title = titleInput.value;
      dbPut(record).catch(err => console.warn('題名の保存に失敗しました:', err));
    });
    popupNode.appendChild(titleInput);

    if (takenAt) {
      const dateEl = document.createElement('div');
      dateEl.className = 'popup-coords';
      dateEl.textContent = formatDate(takenAt);
      popupNode.appendChild(dateEl);
    }

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'popup-delete-btn';
    delBtn.textContent = '🗑 この写真を削除';
    delBtn.addEventListener('click', () => openDeleteModal(record.key));
    popupNode.appendChild(delBtn);

    marker.bindPopup(popupNode);
    markerGroup.addLayer(marker);

    item.addEventListener('click', () => {
      map.setView([lat, lon], 15);
      marker.openPopup();
    });
  } else {
    // GPSが無い写真はマップに出ないので、クリックで削除ポップアップを開く
    item.addEventListener('click', () => openDeleteModal(record.key));
  }

  elementsByKey.set(record.key, { record, item, marker, imgSrc });

  updateStatus();
  return item;
}

// ── 削除ポップアップ ──
const deleteModal = document.getElementById('delete-modal');
const deleteModalImg = document.getElementById('delete-modal-img');
const deleteModalText = document.getElementById('delete-modal-text');
const deleteModalConfirm = document.getElementById('delete-modal-confirm');
let pendingDeleteKey = null;

function openDeleteModal(key) {
  const entry = elementsByKey.get(key);
  if (!entry) return;
  pendingDeleteKey = key;
  deleteModalImg.src = entry.imgSrc;
  const noGps = entry.record.lat === null || entry.record.lon === null;
  deleteModalText.textContent =
    `「${entry.record.name}」を削除しますか？\nこの操作は取り消せません。` +
    (noGps ? '\n（この写真はGPS情報が無いため地図には表示されていません）' : '');
  deleteModal.hidden = false;
}

function closeDeleteModal() {
  deleteModal.hidden = true;
  pendingDeleteKey = null;
}

function removePhotoFromView(key) {
  const entry = elementsByKey.get(key);
  if (!entry) return;
  const { record, item, marker } = entry;
  if (marker) markerGroup.removeLayer(marker);
  if (item && item.parentNode) item.parentNode.removeChild(item);
  elementsByKey.delete(key);
  recordsByKey.delete(key);
  loadedKeys.delete(`${record.name}_${record.size}`);
  totalCount = Math.max(0, totalCount - 1);
  if (record.lat !== null && record.lon !== null) gpsCount = Math.max(0, gpsCount - 1);
  updateStatus();
  if (totalCount === 0) showEmptyMessage('写真を追加すると一覧が表示されます');
}

deleteModalConfirm.addEventListener('click', async () => {
  if (!pendingDeleteKey) return;
  const key = pendingDeleteKey;
  deleteModalConfirm.disabled = true;
  try {
    await dbDelete(key);
    removePhotoFromView(key);
    closeDeleteModal();
  } catch (err) {
    console.warn('削除に失敗しました:', err);
    alert('削除に失敗しました。もう一度お試しください。');
  } finally {
    deleteModalConfirm.disabled = false;
  }
});

document.getElementById('delete-modal-cancel').addEventListener('click', closeDeleteModal);
deleteModal.addEventListener('click', (e) => {
  if (e.target === deleteModal) closeDeleteModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !deleteModal.hidden) closeDeleteModal();
});

function fitToMarkers() {
  map.invalidateSize();
  const layers = markerGroup.getLayers();
  if (layers.length === 0) return;
  if (layers.length === 1) {
    map.setView(layers[0].getLatLng(), 15);
  } else {
    const group = L.featureGroup(layers);
    map.fitBounds(group.getBounds().pad(0.2));
  }
}

async function loadSavedPhotos() {
  try {
    const records = await dbGetAll();
    records.forEach(record => {
      loadedKeys.add(`${record.name}_${record.size}`);
      recordsByKey.set(record.key, record);
      renderPhoto(record, URL.createObjectURL(record.blob));
    });
    if (records.length === 0) {
      showEmptyMessage('写真を追加すると一覧が表示されます');
    }
    if (records.some(r => r.lat !== null && r.lon !== null)) fitToMarkers();
  } catch (err) {
    console.warn('保存済み写真の読み込みに失敗しました:', err);
    showEmptyMessage('写真の読み込みに失敗しました。再読み込みしてください');
  }
}

function formatDate(value) {
  const d = value instanceof Date ? value : new Date(value);
  if (isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}/${m}/${day}`;
}

// --- イベント設定 ---
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

// 保存済みの写真（ピン・題名を含む）をこの端末から読み込んで表示
loadSavedPhotos();
</script>

</body>
</html>
