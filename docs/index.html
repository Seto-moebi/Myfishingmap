<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>俺たちの釣りマップ｜マップを選ぶ</title>
<script src="config.js"></script>

<style>
  :root {
    --accent: #2563eb;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 40px 20px 24px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 700;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .map-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .map-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .map-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgba(37, 99, 235, .1);
  }
  .map-card .name {
    font-size: 16px;
    font-weight: 700;
  }
  .note {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>📍 俺たちの釣りマップ</h1>
</header>

<div class="wrap">
  <div class="map-list" id="map-list"></div>
  <p class="note">写真とピンは、選んだ場所ごとに分けてこの端末に保存されます</p>
</div>

<script>
const listEl = document.getElementById('map-list');
FISHING_MAPS.forEach(({ id, label }) => {
  const a = document.createElement('a');
  a.className = 'map-card';
  a.href = `local_map.html?map=${encodeURIComponent(id)}`;
  a.innerHTML = `<div class="name">${label}</div>`;
  listEl.appendChild(a);
});
</script>

</body>
</html>
