<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>俺の釣りマップ｜マップを選ぶ</title>
<script src="config.js"></script>

<style>
  :root {
    --text: #f2f8fb;
    --muted: rgba(255, 255, 255, .9);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--text);
    position: relative;
    overflow-x: hidden;
    /* 上部10%:波打ち際の明るい水色 / 中盤:水色 / 下部:やや深い水色（全体的にライトめ） */
    background:
      linear-gradient(to bottom,
        #ace8f5 0%,
        #ace8f5 9%,
        #8ad8ef 13%,
        #67bce0 40%,
        #55a6cf 62%,
        #4a92bc 78%,
        #4283ab 90%,
        #3d7ba1 100%);
    background-attachment: fixed;
  }

  /* ── 水面の波 (上部およそ10%の位置) ── */
  .surface {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 16%;
    min-height: 90px;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .surface svg {
    position: absolute;
    left: -5%;
    bottom: 0;
    width: 110%;
    height: 100%;
  }
  .wave-back { fill: rgba(255, 255, 255, .28); animation: wave-drift 13s ease-in-out infinite; }
  .wave-mid  { fill: rgba(255, 255, 255, .40); animation: wave-drift 9s ease-in-out infinite reverse; }
  .wave-front{ fill: rgba(255, 255, 255, .70); animation: wave-drift 7s ease-in-out infinite; }
  @keyframes wave-drift {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(-4%); }
  }

  /* ── 気泡 ── */
  .bubbles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 60%, rgba(255,255,255,0) 75%);
    border: 1px solid rgba(255, 255, 255, .35);
    animation-name: bubble-rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes bubble-rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: .8; }
    80%  { opacity: .7; }
    100% { transform: translateY(-108vh) translateX(var(--drift, 20px)); opacity: 0; }
  }

  /* ── コンテンツ ── */
  .page {
    position: relative;
    z-index: 3;
  }
  header {
    padding: 64px 20px 20px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .04em;
    text-shadow: 0 2px 10px rgba(0, 20, 40, .45), 0 0 2px rgba(0, 20, 40, .4);
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 8px 16px 72px;
  }

  /* 横1行に3つ */
  .map-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .map-card {
    position: relative;
    display: flex;
    align-items: flex-end;
    aspect-ratio: 3 / 4;
    border-radius: 14px;
    padding: 12px 12px 14px;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    background-color: var(--card-color, #35576b);
    background-image:
      linear-gradient(to top, rgba(2, 14, 28, .88) 0%, rgba(2, 14, 28, .30) 45%, rgba(2, 14, 28, .06) 100%),
      var(--card-img, none);
    background-size: cover;
    /* 元画像の左端をボタンの左端に合わせる（はみ出しは右側でトリミング） */
    background-position: left center;
    border: 1px solid rgba(255, 255, 255, .22);
    box-shadow: 0 10px 24px rgba(0, 25, 50, .35), inset 0 0 40px rgba(0, 20, 45, .25);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .map-card:hover, .map-card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, .6);
    box-shadow: 0 14px 30px rgba(0, 30, 60, .45), inset 0 0 40px rgba(0, 20, 45, .2);
    outline: none;
  }
  .map-card .name {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.3;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .75);
  }
  .note {
    margin-top: 26px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    text-shadow: 0 1px 6px rgba(0, 20, 40, .5);
  }

  @media (max-width: 400px) {
    header { padding-top: 52px; }
    header h1 { font-size: 20px; }
    .map-card { padding: 9px 9px 10px; border-radius: 12px; }
    .map-card .name { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="surface" aria-hidden="true">
  <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
    <path class="wave-back"  d="M0,70 C150,110 350,20 600,60 C850,100 1050,30 1200,70 L1200,120 L0,120 Z" />
    <path class="wave-mid"   d="M0,82 C180,50 380,110 600,80 C820,50 1020,110 1200,80 L1200,120 L0,120 Z" />
    <path class="wave-front" d="M0,96 C200,70 400,120 600,98 C800,76 1000,122 1200,98 L1200,120 L0,120 Z" />
  </svg>
</div>

<div class="bubbles" id="bubbles" aria-hidden="true"></div>

<div class="page">
  <header>
    <h1>📍 俺の釣りマップ</h1>
  </header>

  <div class="wrap">
    <div class="map-list" id="map-list"></div>
    <p class="note">写真とピンは、選んだ場所ごとに分けてこの端末に保存されます</p>
  </div>
</div>

<script>
// ── マップ一覧を描画 ──
const listEl = document.getElementById('map-list');
FISHING_MAPS.forEach(({ id, label, image, color }) => {
  const a = document.createElement('a');
  a.className = 'map-card';
  a.href = `local_map.html?map=${encodeURIComponent(id)}`;
  if (color) a.style.setProperty('--card-color', color);
  if (image) a.style.setProperty('--card-img', `url("${image}")`);
  // 「○○の釣りマップ」から「の釣りマップ」を除いて、魚種名だけを表示する
  const shortName = label.replace(/の?釣りマップ$/, '');
  a.innerHTML = `<div class="name">${shortName}</div>`;
  listEl.appendChild(a);
});

// ── 気泡を生成 ──
const bubbleLayer = document.getElementById('bubbles');
const BUBBLE_COUNT = 26;
for (let i = 0; i < BUBBLE_COUNT; i++) {
  const b = document.createElement('span');
  b.className = 'bubble';
  const size = 4 + Math.random() * 16;
  const duration = 7 + Math.random() * 11;
  b.style.width = b.style.height = `${size}px`;
  b.style.left = `${Math.random() * 100}%`;
  b.style.setProperty('--drift', `${(Math.random() * 60 - 30).toFixed(0)}px`);
  b.style.animationDuration = `${duration.toFixed(1)}s`;
  b.style.animationDelay = `${(-Math.random() * duration).toFixed(1)}s`;
  bubbleLayer.appendChild(b);
}
</script>

</body>
</html>
